<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Google tag (gtag.js) — page_location is sent without the #fragment, so names in links never reach analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-M8D1B87952"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-M8D1B87952', {page_location: location.origin + location.pathname});
</script>

<title>Certificate Verification | London Petro Academy</title>
<meta name="description" content="Verify a London Petro Academy certificate of completion.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --page:#f6f3ee;--page2:#edeae3;--page3:#fff;
  --ink:#18191c;--ink-mid:#3d3f45;--ink-light:#6b6f78;
  --line:rgba(0,0,0,0.09);--line2:rgba(0,0,0,0.15);
  --dark:#0c0d0f;--dark2:#141618;
  --amber:#c8873a;--amber2:#e09a4a;--amber-ink:#9a6223;
  --ok:#1f7a4d;--ok-bg:#e8f4ed;--bad:#a33a2a;--bad-bg:#fbeceb;
  --serif:'Fraunces',serif;--sans:'Barlow',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--page);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;min-height:100vh;display:flex;flex-direction:column;}
a{color:inherit}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;flex-shrink:0}

/* Header */
.top{background:var(--dark);padding:0 48px;height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.07);}
.top img{height:44px;width:auto;display:block}
.top-link{font-size:12px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--amber);text-decoration:none;border:1px solid var(--amber);padding:10px 20px;transition:background .2s,color .2s;}
.top-link:hover{background:var(--amber);color:var(--dark);}

/* Band */
.band{background:var(--dark);color:#fff;padding:48px 48px 120px;position:relative;overflow:hidden;text-align:center;}
.band::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 50% 90% at 50% 0%,rgba(200,135,58,.2),transparent 70%);}
.band > *{position:relative}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:var(--amber);margin-bottom:12px;}
.band h1{font-family:var(--serif);font-weight:300;font-size:clamp(30px,4vw,46px);line-height:1.05;}
.band h1 em{font-style:italic;color:var(--amber)}

main{flex:1;padding:0 24px 72px;}
.wrap{max-width:820px;margin:-84px auto 0;position:relative;}

/* Certificate card */
.cert{background:var(--page3);box-shadow:0 30px 80px rgba(0,0,0,.18);padding:10px;}
.cert-in{border:1px solid rgba(200,135,58,.45);outline:1px solid rgba(200,135,58,.2);outline-offset:-7px;padding:48px 48px 40px;text-align:center;}
.status{display:inline-flex;align-items:center;gap:10px;padding:9px 18px;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-bottom:28px;}
.status svg{width:18px;height:18px;stroke:currentColor;fill:none;}
.status.ok{background:var(--ok-bg);color:var(--ok);}
.status.bad{background:var(--bad-bg);color:var(--bad);}
.seal{width:92px;height:92px;margin:0 auto 22px;display:block;}
.lbl{font-size:11px;font-weight:500;letter-spacing:2.5px;text-transform:uppercase;color:var(--ink-light);}
.name{font-family:var(--serif);font-weight:400;font-size:clamp(30px,4.6vw,48px);line-height:1.1;margin:10px 0 14px;overflow-wrap:anywhere;}
.completed{font-size:16px;color:var(--ink-mid);font-weight:300;}
.course{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(22px,3vw,30px);color:var(--amber-ink);line-height:1.25;margin:10px auto 30px;max-width:620px;}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);text-align:left;margin-bottom:28px;}
.fact{background:var(--page3);padding:16px 20px;}
.fact .lbl{display:block;margin-bottom:4px;font-size:10px;}
.fact b{font-weight:500;font-size:15.5px;color:var(--ink);}
.fact code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14.5px;font-weight:500;}
.issuer{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;padding-top:24px;border-top:1px solid var(--line);}
.issuer img{height:40px;width:auto;}
.issuer p{font-size:13.5px;color:var(--ink-light);text-align:left;line-height:1.5;}
.checked{font-size:12.5px;color:var(--ink-light);margin-top:18px;}

.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:14px 22px;font-family:var(--sans);font-size:12.5px;font-weight:500;letter-spacing:2px;text-transform:uppercase;text-decoration:none;border:none;cursor:pointer;transition:background .2s,color .2s,border-color .2s;}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;}
.btn-dark{background:var(--ink);color:#fff;}
.btn-dark:hover{background:var(--amber);color:var(--dark);}
.btn-line{background:var(--page3);border:1.5px solid var(--line2);color:var(--ink);}
.btn-line:hover{border-color:var(--amber);color:var(--amber-ink);}

/* Not found / lookup */
.msg{font-size:16px;color:var(--ink-mid);line-height:1.7;max-width:560px;margin:0 auto 26px;}
.msg h2{font-family:var(--serif);font-weight:400;font-size:30px;color:var(--ink);margin-bottom:10px;line-height:1.15;}
form{max-width:480px;margin:0 auto;text-align:left;display:flex;flex-direction:column;gap:14px;}
label span{display:block;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--ink-mid);margin-bottom:6px;}
input{width:100%;padding:13px 15px;border:1.5px solid var(--line2);background:#faf9f7;font-family:var(--sans);font-size:16px;color:var(--ink);outline:none;border-radius:0;-webkit-appearance:none;}
input:focus{border-color:var(--amber);background:#fff;}
.hint{font-size:13px;color:var(--ink-light);margin-top:4px;}
form .btn{width:100%;margin-top:4px;}
.loading{padding:60px 0;color:var(--ink-light);font-size:15px;}

footer{background:var(--dark2);color:#7a7f88;padding:28px 48px;font-size:12.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}
footer a{color:#9aa0a8;text-decoration:none}
footer a:hover{color:var(--amber)}

:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

@media(max-width:700px){
  .top{padding:0 16px;height:64px}
  .top img{height:34px}
  .top-link{padding:8px 12px;font-size:11px;letter-spacing:1.5px}
  .band{padding:36px 16px 104px}
  main{padding:0 12px 48px}
  .cert-in{padding:32px 18px 28px}
  .facts{grid-template-columns:minmax(0,1fr)}
  .seal{width:76px;height:76px}
  .issuer{flex-direction:column;}
  .issuer p{text-align:center}
  .btn{width:100%}
  footer{padding:24px 16px}
}
@media print{
  .top-link,.actions,footer,.band::before{display:none!important}
  .band{padding:20px;background:#fff;color:#000}
  .wrap{margin-top:0}
  .cert{box-shadow:none}
}
</style>
</head>
<body>

<header class="top">
  <a href="/"><img src="logo-white.png" alt="London Petro Academy" width="1202" height="316"></a>
  <a class="top-link" href="/">Visit website</a>
</header>

<div class="band">
  <div class="eyebrow">Official record</div>
  <h1>Certificate <em>verification</em></h1>
</div>

<main>
  <div class="wrap">
    <div class="cert"><div class="cert-in" id="out" aria-live="polite">
      <div class="loading">Checking certificate…</div>
    </div></div>
  </div>
</main>

<footer>
  <span>© 2026 London Petro Academy Ltd · Registered in England &amp; Wales No. 09875694 · 207 Regent Street, London W1B 3HH</span>
  <span><a href="mailto:info@londonpetroacademy.co.uk">info@londonpetroacademy.co.uk</a> · <a href="privacy-policy.html">Privacy</a></span>
</footer>

<template id="t-seal">
  <svg class="seal" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="46" fill="none" stroke="#c8873a" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="40" fill="#fbf4ea" stroke="#c8873a" stroke-width="1" stroke-dasharray="2 3"/>
    <circle cx="50" cy="50" r="27" fill="#1f7a4d"/>
    <polyline points="38,51 46,59 63,42" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</template>

<script>
(function(){
  'use strict';
  var REGISTRY_URL = 'certificates/registry.json';
  var out = document.getElementById('out');
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function track(name,p){try{if(window.gtag)gtag('event',name,p||{});}catch(e){}}

  /* Must match the generator script exactly. */
  function normName(s){
    s = String(s||'').normalize('NFKD').replace(/[̀-ͯ]/g,'');
    s = s.replace(/[łŁ]/g,'l').replace(/[øØ]/g,'o').replace(/[đĐ]/g,'d').replace(/ß/g,'ss').replace(/[æÆ]/g,'ae').replace(/[ıİ]/g,'i');
    s = s.toLowerCase().replace(/[^a-z ]+/g,' ').replace(/\s+/g,' ').trim();
    var t; do { t = s; s = s.replace(/^(dr|mr|mrs|ms|miss|mx|prof|professor|eng|engr|sir|dame|hon)\s+/,''); } while (s !== t);
    return s;
  }
  function normId(s){return String(s||'').toUpperCase().replace(/\s+/g,'').trim();}
  async function sha256(str){
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
  }
  function fmtDate(iso){var d=iso.split('-');return (+d[2])+' '+MONTHS[+d[1]-1]+' '+d[0];}
  function fmtRange(a,b){
    var x=a.split('-'),y=b.split('-');
    if(x[0]===y[0]&&x[1]===y[1]) return (+x[2])+'–'+(+y[2])+' '+MONTHS[+x[1]-1]+' '+x[0];
    return fmtDate(a)+' – '+fmtDate(b);
  }
  function params(){
    var h = location.hash.replace(/^#/,''), q = location.search.replace(/^\?/,'');
    var p = new URLSearchParams(h || q);
    return {id: p.get('id')||'', n: p.get('n')||''};
  }

  var registry = null;
  function load(){
    if(registry) return Promise.resolve(registry);
    return fetch(REGISTRY_URL,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(function(j){registry=j;return j;});
  }

  function lookupForm(prefill, heading, text){
    out.innerHTML =
      '<div class="msg"><h2>'+heading+'</h2><p>'+text+'</p></div>'+
      '<form id="f" novalidate>'+
        '<label><span>Certificate number</span><input id="f-id" name="id" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. LPA-LON26-LNGVC-001" value="'+esc(prefill.id||'')+'" required></label>'+
        '<label><span>Participant name</span><input id="f-n" name="n" autocomplete="off" spellcheck="false" placeholder="Full name as printed on the certificate" value="'+esc(prefill.n||'')+'" required><div class="hint">Titles such as Dr or Mr, accents and capital letters don’t matter.</div></label>'+
        '<button class="btn btn-dark" type="submit">Verify certificate</button>'+
      '</form>';
    document.getElementById('f').addEventListener('submit',function(e){
      e.preventDefault();
      var id=document.getElementById('f-id').value.trim(), n=document.getElementById('f-n').value.trim();
      if(!id||!n) return;
      var p=new URLSearchParams();p.set('id',normId(id));p.set('n',n);
      history.replaceState(null,'','#'+p.toString());
      run('manual');
    });
  }

  function showVerified(id, name, cert, course){
    var tpl = document.getElementById('t-seal').innerHTML;
    var today = new Date();
    var checked = today.getDate()+' '+MONTHS[today.getMonth()]+' '+today.getFullYear();
    var where = (course.mode ? course.mode+' · ' : '') + course.location;
    out.innerHTML =
      '<div class="status ok"><svg viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Verified certificate</div>'+
      tpl+
      '<div class="lbl">This certifies that</div>'+
      '<div class="name">'+esc(name)+'</div>'+
      '<p class="completed">has successfully completed the London Petro Academy course</p>'+
      '<div class="course">'+esc(course.title)+'</div>'+
      '<div class="facts">'+
        '<div class="fact"><span class="lbl">Course dates</span><b>'+esc(fmtRange(course.start,course.end))+'</b></div>'+
        '<div class="fact"><span class="lbl">Delivery</span><b>'+esc(where)+'</b></div>'+
        '<div class="fact"><span class="lbl">Certificate number</span><code>'+esc(id)+'</code></div>'+
        '<div class="fact"><span class="lbl">Date issued</span><b>'+esc(fmtDate(cert.issued||course.issued))+'</b></div>'+
      '</div>'+
      '<div class="issuer"><img src="logo-dark.png" alt="London Petro Academy" width="1202" height="316"><p>Issued by London Petro Academy Ltd, London<br>Registered in England &amp; Wales No. 09875694</p></div>'+
      '<p class="checked">Checked against London Petro Academy records on '+checked+'.</p>'+
      '<div class="actions">'+
        (course.page?'<a class="btn btn-line" href="'+esc(course.page)+'">About this course</a>':'')+
        '<a class="btn btn-dark" href="/">London Petro Academy</a>'+
      '</div>';
    document.title = 'Verified certificate · '+name+' | London Petro Academy';
  }

  async function run(source){
    var p = params();
    if(!p.id || !p.n){
      lookupForm(p,'Verify a certificate','Scan the QR code on a London Petro Academy certificate, or enter the certificate number and participant name below.');
      return;
    }
    out.innerHTML = '<div class="loading">Checking certificate…</div>';
    document.title = 'Certificate Verification | London Petro Academy';
    try{
      var reg = await load();
      var id = normId(p.id), cert = reg.certificates[id];
      var ok = false, course = null;
      if(cert && !cert.revoked){
        var h = await sha256(id+'|'+normName(p.n));
        ok = (h === cert.h);
        course = reg.courses[cert.c];
      }
      if(ok && course){
        showVerified(id, p.n, cert, course);
        track('certificate_verified',{course_key:cert.c, method:source||'link'});
      }else{
        lookupForm({id:id,n:p.n},'Certificate not found','We couldn’t match this certificate number and name to our records. Please check both exactly as printed on the certificate, or contact <a href="mailto:info@londonpetroacademy.co.uk">info@londonpetroacademy.co.uk</a> for help.');
        out.insertAdjacentHTML('afterbegin','<div class="status bad"><svg viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Not verified</div>');
        track('certificate_not_found',{method:source||'link'});
      }
    }catch(e){
      out.innerHTML = '<div class="msg"><h2>We couldn’t check this right now</h2><p>Please try again in a moment, or contact <a href="mailto:info@londonpetroacademy.co.uk">info@londonpetroacademy.co.uk</a>.</p></div>';
    }
  }

  window.addEventListener('hashchange',function(){run('link');});
  run('link');
})();
</script>
</body>
</html>
